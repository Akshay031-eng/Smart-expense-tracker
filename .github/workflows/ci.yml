name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node 22 + MongoDB 7)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Run tests
        run: npm test
        env:
          TEST_MONGO_URL: mongodb://localhost:27017

      - name: App starts and answers /health
        run: |
          node server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "Server did not become healthy" && exit 1
        env:
          MONGODB_URI: mongodb://localhost:27017/smart_expense_ci
          SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
